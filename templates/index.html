<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent — Computer Use</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        /* ═══════════ RESET & ROOT ═══════════ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a28;
            --bg-card-hover: #222236;
            --border: #2a2a40;
            --border-glow: #6c5ce7;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a8;
            --text-muted: #55557a;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --success: #00d2a0;
            --warning: #ffc048;
            --error: #ff6b6b;
            --info: #4ecdc4;
            --gradient-1: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --gradient-2: linear-gradient(135deg, #00d2a0 0%, #4ecdc4 100%);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px rgba(108, 92, 231, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ═══════════ ANIMATED BACKGROUND ═══════════ */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(108,92,231,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,92,231,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 { top: -200px; right: -100px; background: var(--accent); }
        .bg-glow-2 { bottom: -200px; left: -100px; background: var(--success); }

        /* ═══════════ LAYOUT ═══════════ */
        .app { position: relative; z-index: 1; padding: 20px; max-width: 1600px; margin: 0 auto; }

        /* ═══════════ HEADER ═══════════ */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px;
            background: rgba(26, 26, 40, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo {
            width: 44px; height: 44px;
            background: var(--gradient-1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
        }
        .logo-text h1 {
            font-size: 18px; font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text p { font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

        .header-right { display: flex; align-items: center; gap: 12px; }

        .status-badge {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 210, 160, 0.1);
            border: 1px solid rgba(0, 210, 160, 0.3);
            border-radius: 100px;
            font-size: 13px; font-weight: 600;
            color: var(--success);
            transition: all 0.3s;
        }
        .status-badge.running { background: rgba(108, 92, 231, 0.15); border-color: rgba(108, 92, 231, 0.4); color: var(--accent-light); }
        .status-badge.error { background: rgba(255, 107, 107, 0.1); border-color: rgba(255, 107, 107, 0.3); color: var(--error); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: currentColor;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ═══════════ MAIN GRID ═══════════ */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: auto 1fr;
            gap: 20px;
            min-height: calc(100vh - 160px);
        }

        /* ═══════════ CARD ═══════════ */
        .card {
            background: rgba(26, 26, 40, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .card:hover { border-color: rgba(108, 92, 231, 0.3); }
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }
        .card-header h2 {
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .card-body { padding: 16px 20px; }

        /* ═══════════ SCREEN FEED ═══════════ */
        .screen-card { grid-column: 1; grid-row: 1 / 3; }
        .screen-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin: 16px 0;
        }
        .screen-container img {
            width: 100%; height: 100%;
            object-fit: contain;
            transition: opacity 0.3s;
        }
        .screen-overlay {
            position: absolute; top: 12px; right: 12px;
            display: flex; gap: 8px;
        }
        .screen-badge {
            padding: 4px 10px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 6px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }
        .screen-placeholder {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-muted);
            gap: 12px;
        }
        .screen-placeholder-icon { font-size: 48px; opacity: 0.3; }

        /* ═══════════ TASK INPUT ═══════════ */
        .task-input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.15);
        }
        .input-group {
            display: flex; gap: 10px;
        }
        .task-input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .task-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15); }
        .task-input::placeholder { color: var(--text-muted); }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }
        .btn-danger:hover { transform: translateY(-1px); }

        /* ═══════════ LOG PANEL ═══════════ */
        .log-card { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; }
        .log-card .card-body {
            flex: 1; overflow-y: auto; padding: 12px;
            max-height: calc(100vh - 260px);
        }

        .log-entry {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--border);
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.thought { border-left-color: var(--accent); }
        .log-entry.action { border-left-color: var(--success); }
        .log-entry.error { border-left-color: var(--error); }
        .log-entry.system { border-left-color: var(--info); }
        .log-entry.done { border-left-color: var(--warning); background: rgba(255, 192, 72, 0.05); }

        .log-meta {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 4px;
        }
        .log-type {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .log-type.thought { color: var(--accent-light); background: rgba(108,92,231,0.15); }
        .log-type.action { color: var(--success); background: rgba(0,210,160,0.12); }
        .log-type.error { color: var(--error); background: rgba(255,107,107,0.12); }
        .log-type.system { color: var(--info); background: rgba(78,205,196,0.12); }
        .log-type.done { color: var(--warning); background: rgba(255,192,72,0.12); }

        .log-time { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .log-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; word-break: break-word; }

        .log-step-header {
            text-align: center;
            padding: 8px;
            margin: 12px 0 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-light);
            background: rgba(108, 92, 231, 0.08);
            border-radius: 8px;
            letter-spacing: 1px;
        }

        /* ═══════════ STATS BAR ═══════════ */
        .stats-bar {
            display: flex; gap: 12px;
            padding: 0 20px 16px;
        }
        .stat {
            flex: 1;
            padding: 12px;
            background: rgba(0,0,0,0.25);
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* ═══════════ SCROLLBAR ═══════════ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ═══════════ RESPONSIVE ═══════════ */
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; grid-template-rows: auto auto; }
            .screen-card { grid-column: 1; grid-row: 1; }
            .log-card { grid-column: 1; grid-row: 2; }
            .log-card .card-body { max-height: 400px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo">🤖</div>
                <div class="logo-text">
                    <h1>AI Agent</h1>
                    <p>Computer Use • Free & Unlimited</p>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot"></div>
                    <span id="statusText">Ready</span>
                </div>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-grid">
            <!-- SCREEN FEED -->
            <div class="card screen-card">
                <div class="card-header">
                    <h2>🖥️ Live Screen</h2>
                    <span id="stepCounter" style="font-size:13px; color:var(--text-muted); font-family:'JetBrains Mono',monospace;">Step 0/30</span>
                </div>

                <!-- Stats -->
                <div class="stats-bar" style="padding-top:16px;">
                    <div class="stat">
                        <div class="stat-value" id="statSteps">0</div>
                        <div class="stat-label">Steps</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="statActions">0</div>
                        <div class="stat-label">Actions</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="statProvider">—</div>
                        <div class="stat-label">Provider</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="statTime">0s</div>
                        <div class="stat-label">Elapsed</div>
                    </div>
                </div>

                <!-- Screen -->
                <div class="card-body" style="padding-top:0;">
                    <div class="screen-container" id="screenContainer">
                        <div class="screen-placeholder" id="screenPlaceholder">
                            <div class="screen-placeholder-icon">🖥️</div>
                            <p>Nhập nhiệm vụ bên dưới để bắt đầu</p>
                        </div>
                        <img id="screenImg" src="" alt="Screen" style="display:none;">
                        <div class="screen-overlay">
                            <span class="screen-badge" id="screenRes">1920×1080</span>
                        </div>
                    </div>
                </div>

                <!-- Task Input -->
                <div class="task-input-area">
                    <div class="input-group">
                        <input type="text" class="task-input" id="taskInput"
                               placeholder="Ví dụ: Mở Notepad và gõ Hello World..."
                               autocomplete="off">
                        <button class="btn btn-primary" id="startBtn" onclick="startTask()">
                            ▶ Start
                        </button>
                        <button class="btn btn-danger" id="stopBtn" onclick="stopTask()" style="display:none;">
                            ■ Stop
                        </button>
                    </div>
                </div>
            </div>

            <!-- LOG PANEL -->
            <div class="card log-card">
                <div class="card-header">
                    <h2>📋 Agent Log</h2>
                    <button onclick="clearLog()" style="background:none; border:1px solid var(--border); color:var(--text-muted); padding:4px 12px; border-radius:6px; cursor:pointer; font-size:12px;">Clear</button>
                </div>
                <div class="card-body" id="logPanel">
                    <div class="log-entry system">
                        <div class="log-meta">
                            <span class="log-type system">System</span>
                            <span class="log-time" id="initTime"></span>
                        </div>
                        <div class="log-text">🤖 AI Agent sẵn sàng. Nhập nhiệm vụ và nhấn Start.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════ SOCKET.IO ═══════════
        const socket = io();
        let isRunning = false;
        let startTime = null;
        let timerInterval = null;

        // Init time
        document.getElementById('initTime').textContent = new Date().toLocaleTimeString('vi-VN');

        // ═══════════ START / STOP ═══════════
        function startTask() {
            const input = document.getElementById('taskInput');
            const task = input.value.trim();
            if (!task) { input.focus(); return; }

            socket.emit('start_task', { task });
            setRunning(true);
            addLog('system', `🎯 Nhiệm vụ: ${task}`);
            input.value = '';
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTask() {
            socket.emit('stop_task');
            addLog('system', '⏹️ Đang dừng Agent...');
        }

        // Enter to start
        document.getElementById('taskInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') startTask();
        });

        // ═══════════ SOCKET EVENTS ═══════════
        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('screenshot', data => {
            const img = document.getElementById('screenImg');
            const placeholder = document.getElementById('screenPlaceholder');
            img.src = 'data:image/jpeg;base64,' + data.image;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        });

        socket.on('step', data => {
            document.getElementById('stepCounter').textContent = `Step ${data.step}/${data.max_steps}`;
            document.getElementById('statSteps').textContent = data.step;
            addStepHeader(data.step);
        });

        socket.on('thought', data => {
            addLog('thought', `💭 ${data.text}`);
        });

        socket.on('action', data => {
            addLog('action', `🖐️ ${data.type}: ${data.details}`);
            document.getElementById('statActions').textContent = data.count || '?';
        });

        socket.on('provider', data => {
            document.getElementById('statProvider').textContent = data.name || '—';
        });

        socket.on('error', data => {
            addLog('error', `❌ ${data.text}`);
        });

        socket.on('done', data => {
            addLog('done', `🎉 ${data.text}`);
            setRunning(false);
        });

        socket.on('stopped', data => {
            addLog('system', `⏹️ ${data.text || 'Agent đã dừng.'}`);
            setRunning(false);
        });

        // ═══════════ UI HELPERS ═══════════
        function setRunning(running) {
            isRunning = running;
            const badge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            if (running) {
                badge.className = 'status-badge running';
                statusText.textContent = 'Running';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'flex';
            } else {
                badge.className = 'status-badge';
                statusText.textContent = 'Ready';
                startBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            }
        }

        function addLog(type, text) {
            const panel = document.getElementById('logPanel');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `
                <div class="log-meta">
                    <span class="log-type ${type}">${type}</span>
                    <span class="log-time">${new Date().toLocaleTimeString('vi-VN')}</span>
                </div>
                <div class="log-text">${text}</div>
            `;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function addStepHeader(step) {
            const panel = document.getElementById('logPanel');
            const header = document.createElement('div');
            header.className = 'log-step-header';
            header.textContent = `━━━ BƯỚC ${step} ━━━`;
            panel.appendChild(header);
            panel.scrollTop = panel.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logPanel').innerHTML = '';
            addLog('system', '📋 Log đã được xóa.');
        }

        function updateTimer() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const m = Math.floor(elapsed / 60);
            const s = elapsed % 60;
            document.getElementById('statTime').textContent = m > 0 ? `${m}m${s}s` : `${s}s`;
        }
    </script>
</body>
</html>
